<body class="bg-gray-100 font-sans">

        <a href="orders.html" class="flex items-center gap-3 px-4 py-2 rounded-lg text-gray-700 hover:bg-gray-100 hover:text-blue-700 transition-all">

        <a href="user_management.html" class="flex items-center gap-3 px-4 py-2 rounded-lg text-gray-700 hover:bg-gray-100 hover:text-blue-700 transition-all">

        <a href="delivery.html" class="flex items-center gap-3 px-4 py-2 rounded-lg text-blue-700 bg-blue-100">

        <div class="mt-auto pt-6 border-t border-gray-200">
          <a href="logout.php" class="flex items-center gap-3 px-4 py-2 rounded-lg text-red-600 hover:bg-red-100 transition-all">
            <i data-lucide="log-out" class="w-5 h-5"></i>
            Logout
          </a>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-10">
    <!-- Header and Assign Button -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
      <h1 class="text-3xl font-bold text-gray-800">Delivery Management</h1>
      <button onclick="openDeliveryHistoryModal()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">View History</button>
    </div>

    <!-- Filter/Search Bar -->
    <div class="flex flex-wrap gap-2 mb-4">
      <input type="text" id="searchDelivery" placeholder="Search by rider or customer..." class="border px-3 py-2 rounded w-full sm:w-64">
      <select id="statusFilter" class="border px-3 py-2 rounded">
        <option value="">All Statuses</option>
        <option value="Queued">Queued</option>
        <option value="Out for Delivery">Out for Delivery</option>
        <option value="Ready for Pickup">Ready for Pickup</option>
        <option value="Delivered">Delivered</option>
        <option value="Failed">Failed</option>
        <option value="Cancelled">Cancelled</option>
      </select>
    </div>

    <!-- Delivery Table -->
    <div class="bg-white rounded shadow overflow-x-auto">
      <table class="min-w-full text-sm">
        <thead class="bg-gray-100 text-left">
          <tr>
            <th class="px-4 py-2">Order ID</th>
            <th class="px-4 py-2">Address</th>
            <th class="px-4 py-2">Rider</th>
            <th class="px-4 py-2">Status</th>
            <th class="px-4 py-2">Completion Time</th>
            <th class="px-4 py-2 text-right">Actions</th>
          </tr>
        </thead>
        <tbody id="deliveryTable" class="divide-y">
          <!-- JS will populate rows here -->
        </tbody>
      </table>
    </div>
  </main>

  </div>

  <!-- Delivery Modal -->
  <div id="deliveryModal" class="fixed inset-0 bg-black bg-opacity-50 hidden justify-center items-center z-50">
    <div class="bg-white p-6 rounded shadow-md w-96">
      <h2 class="text-xl font-bold mb-4" id="modalTitle">Update Delivery</h2>
      <form id="deliveryForm" class="space-y-3">
        
        <label class="block text-sm font-medium text-gray-700">Address</label>
        <input type="text" id="modalAddress" class="w-full border px-3 py-2 rounded" required>
        
        <label class="block text-sm font-medium text-gray-700">Rider</label>
        <input type="text" id="modalRider" class="w-full border px-3 py-2 rounded">

        <label class="block text-sm font-medium text-gray-700">Status</label>
        <select id="modalStatus" class="w-full border px-3 py-2 rounded" required>
          <option value="Queued">Queued</option>
          <option value="Out for Delivery">Out for Delivery</option>
          <option value="Ready for Pickup">Ready for Pickup</option>
          <option value="Delivered">Delivered</option>
          <option value="Failed">Failed</option>
          <option value="Cancelled">Cancelled</option>
        </select>

        <div class="flex justify-end gap-2">
          <button type="button" onclick="closeDeliveryModal()" class="bg-gray-500 text-white px-4 py-2 rounded">Cancel</button>
          <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded">Save</button>
        </div>
        <input type="hidden" id="modalDeliveryId" />
      </form>
    </div>
  </div>

<!-- Modal -->
<div id="deliveryHistoryModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
  <div class="bg-white w-full max-w-2xl p-6 rounded-lg shadow-lg relative">
    <button id="closeModalBtn" class="absolute top-2 right-2 text-red-500 text-xl font-bold">&times;</button>
    <h2 class="text-2xl font-semibold mb-4">Delivery History</h2>
    <div id="historyContainer" class="space-y-4 max-h-[70vh] overflow-y-auto">
      <!-- Entries injected here -->
    </div>
  </div>
</div>



  <script src="updateDeli_request.js"></script>
  <script src="delivery_history.js"></script>
  <script src="deliveryModal_pagination.js"></script>

</body>
</html>
