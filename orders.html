<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Management - Nico's Delivery</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

  <!-- Header -->
  <header class="bg-white shadow px-6 py-4 flex justify-between items-center">
    <h1 class="text-xl font-bold text-blue-600">Nico's Delivery Admin</h1>
    <div>
      <button onclick="alert('Login clicked')" class="text-sm text-blue-600 hover:underline mr-4">Login</button>
      <button onclick="alert('Sign Up clicked')" class="text-sm text-blue-600 hover:underline">Sign Up</button>
    </div>
  </header>

  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-64 bg-white shadow-md px-6 py-8 hidden md:block">
      <h2 class="text-2xl font-bold text-blue-600 mb-8">Admin Panel</h2>
      <nav class="space-y-4">
        <a href="dashboard.html" class="block text-gray-700 font-medium hover:text-blue-600">Dashboard</a>
        <a href="menu.html" class="block text-gray-700 font-medium hover:text-blue-600">Menu Management</a>
        <a href="orders.html" class="block text-blue-600 font-semibold">Order Management</a>
        <a href="inventory.html" class="block text-gray-700 font-medium hover:text-blue-600">Inventory Management</a>
        <a href="customers.html" class="block text-gray-700 font-medium hover:text-blue-600">Customer Management</a>
        <a href="history.html" class="block text-gray-700 font-medium hover:text-blue-600">Order History</a>
        <a href="staff.html" class="block text-gray-700 font-medium hover:text-blue-600">Staff Management</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-10 space-y-8">
      <div class="flex justify-between items-center">
        <h2 class="text-2xl font-bold text-gray-800">Order Management</h2>
        <button onclick="refreshOrders()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Refresh</button>
      </div>

      <!-- Orders Table -->
      <div class="bg-white p-6 rounded-lg shadow overflow-x-auto">
        <table class="min-w-full table-auto">
          <thead>
            <tr class="bg-gray-200 text-gray-600 uppercase text-sm leading-normal">
              <th class="py-3 px-6 text-left">Order ID</th>
              <th class="py-3 px-6 text-left">Customer</th>
              <th class="py-3 px-6 text-left">Items</th>
              <th class="py-3 px-6 text-left">Total</th>
              <th class="py-3 px-6 text-left">Status</th>
              <th class="py-3 px-6 text-center">Actions</th>
            </tr>
          </thead>
          <tbody id="orderTableBody" class="text-gray-700 text-sm font-light">
            <!-- Orders will be dynamically inserted here -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script>
    const orders = [
      {
        id: "#001",
        customer: "John Doe",
        items: "Burger, Fries",
        total: "₱205",
        status: "Pending"
      },
      {
        id: "#002",
        customer: "Jane Smith",
        items: "Lumpia",
        total: "₱85",
        status: "Preparing"
      },
      {
        id: "#003",
        customer: "Mario Cruz",
        items: "Burger, Lumpia, Soda",
        total: "₱310",
        status: "Completed"
      }
    ];

    function refreshOrders() {
      const tbody = document.getElementById("orderTableBody");
      tbody.innerHTML = "";

      orders.forEach(order => {
        const statusColor = {
          "Pending": "bg-yellow-200 text-yellow-800",
          "Preparing": "bg-blue-200 text-blue-800",
          "Completed": "bg-green-200 text-green-800",
          "Cancelled": "bg-red-200 text-red-800"
        };

        tbody.innerHTML += `
          <tr class="border-b border-gray-200 hover:bg-gray-100">
            <td class="py-3 px-6 text-left">${order.id}</td>
            <td class="py-3 px-6 text-left">${order.customer}</td>
            <td class="py-3 px-6 text-left">${order.items}</td>
            <td class="py-3 px-6 text-left">${order.total}</td>
            <td class="py-3 px-6 text-left">
              <span class="${statusColor[order.status]} px-2 py-1 rounded-full text-xs">${order.status}</span>
            </td>
            <td class="py-3 px-6 text-center">
              <button class="text-green-600 hover:underline mr-2" onclick="markCompleted('${order.id}')">Mark Completed</button>
              <button class="text-red-500 hover:underline" onclick="cancelOrder('${order.id}')">Cancel</button>
            </td>
          </tr>
        `;
      });
    }

    function markCompleted(orderId) {
      const order = orders.find(o => o.id === orderId);
      if (order) {
        order.status = "Completed";
        refreshOrders();
        alert(`Order ${orderId} marked as Completed.`);
      }
    }

    function cancelOrder(orderId) {
      const order = orders.find(o => o.id === orderId);
      if (order) {
        order.status = "Cancelled";
        refreshOrders();
        alert(`Order ${orderId} has been Cancelled.`);
      }
    }

    // Initial load
    refreshOrders();
  </script>

</body>
</html>
