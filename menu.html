<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Management - Nico's Delivery</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-64 bg-white shadow-md px-6 py-8">
      <h2 class="text-2xl font-bold text-blue-600 mb-8">Admin Panel</h2>
      <nav class="space-y-4">
        <a href="dashboard.html" class="block text-gray-700 font-medium hover:text-blue-600">Dashboard</a>
        <a href="menu.html" class="block text-blue-600 font-semibold">Menu Management</a>
        <a href="orders.html" class="block text-gray-700 font-medium hover:text-blue-600">Order Management</a>
        <a href="inventory.html" class="block text-gray-700 font-medium hover:text-blue-600">Inventory Management</a>
        <a href="customers.html" class="block text-gray-700 font-medium hover:text-blue-600">Customer Management</a>
        <a href="history.html" class="block text-gray-700 font-medium hover:text-blue-600">Order History</a>
        <a href="staff.html" class="block text-blue-600 font-semibold">Staff Management</a>
      </nav>
    </aside>

    <!-- Menu Content -->
    <main class="flex-1 p-10">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
        <h1 class="text-3xl font-bold text-gray-800">Menu Management</h1>
        <div class="flex gap-2">
          <input type="text" id="searchInput" placeholder="Search item..." class="border px-3 py-2 rounded w-64">
          <button onclick="openAddModal()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Add Item</button>
        </div>
      </div>

      <div class="bg-white rounded shadow overflow-x-auto">
        <table class="min-w-full text-sm">
          <thead class="bg-gray-100 text-left">
            <tr>
              <th class="px-4 py-2">Name</th>
              <th class="px-4 py-2">Price</th>
              <th class="px-4 py-2">Stock</th>
              <th class="px-4 py-2 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="menuTable" class="divide-y"></tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Add/Edit Modal -->
  <div id="menuModal" class="fixed inset-0 bg-black bg-opacity-50 hidden justify-center items-center">
    <div class="bg-white p-6 rounded shadow-md w-96">
      <h2 id="modalTitle" class="text-xl font-bold mb-4">Add Menu Item</h2>
      <form id="menuForm" class="space-y-3">
        <input type="text" id="itemName" placeholder="Item Name" class="w-full border px-3 py-2 rounded" required>
        <input type="number" id="itemPrice" placeholder="Price" class="w-full border px-3 py-2 rounded" required>
        <input type="number" id="itemStock" placeholder="Stock" class="w-full border px-3 py-2 rounded" required>
        <div class="flex justify-end space-x-2">
          <button type="button" onclick="closeModal()" class="bg-gray-500 text-white px-4 py-1 rounded">Cancel</button>
          <button type="submit" class="bg-green-600 text-white px-4 py-1 rounded">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let menuItems = [
      { name: "Lumpia Shanghai", price: 50, stock: 10 },
      { name: "Bicol Express", price: 60, stock: 8 },
      { name: "Adobo", price: 75, stock: 6 }
    ];

    let editingIndex = null;
    const menuTable = document.getElementById("menuTable");
    const menuModal = document.getElementById("menuModal");
    const modalTitle = document.getElementById("modalTitle");
    const menuForm = document.getElementById("menuForm");
    const searchInput = document.getElementById("searchInput");

    function renderMenu(filter = "") {
      menuTable.innerHTML = "";
      menuItems
        .filter(item => item.name.toLowerCase().includes(filter.toLowerCase()))
        .forEach((item, index) => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td class="px-4 py-2">${item.name}</td>
            <td class="px-4 py-2">₱${item.price}</td>
            <td class="px-4 py-2">${item.stock}</td>
            <td class="px-4 py-2 text-right space-x-2">
              <button onclick="editItem(${index})" class="bg-yellow-500 text-white px-3 py-1 rounded text-sm">Edit</button>
              <button onclick="deleteItem(${index})" class="bg-red-500 text-white px-3 py-1 rounded text-sm">Delete</button>
            </td>
          `;
          menuTable.appendChild(row);
        });
    }

    function openAddModal() {
      editingIndex = null;
      modalTitle.textContent = "Add Menu Item";
      menuForm.reset();
      menuModal.classList.remove("hidden");
      menuModal.classList.add("flex");
    }

    function editItem(index) {
      editingIndex = index;
      modalTitle.textContent = "Edit Menu Item";
      const item = menuItems[index];
      document.getElementById("itemName").value = item.name;
      document.getElementById("itemPrice").value = item.price;
      document.getElementById("itemStock").value = item.stock;
      menuModal.classList.remove("hidden");
      menuModal.classList.add("flex");
    }

    function deleteItem(index) {
      if (confirm("Delete this menu item?")) {
        menuItems.splice(index, 1);
        renderMenu(searchInput.value);
      }
    }

    function closeModal() {
      menuModal.classList.add("hidden");
      menuModal.classList.remove("flex");
    }

    menuForm.addEventListener("submit", function(e) {
      e.preventDefault();
      const newItem = {
        name: document.getElementById("itemName").value,
        price: parseFloat(document.getElementById("itemPrice").value),
        stock: parseInt(document.getElementById("itemStock").value)
      };
      if (editingIndex === null) {
        menuItems.push(newItem);
      } else {
        menuItems[editingIndex] = newItem;
      }
      closeModal();
      renderMenu(searchInput.value);
    });

    searchInput.addEventListener("input", () => {
      renderMenu(searchInput.value);
    });

    renderMenu();
  </script>
</body>
</html>
