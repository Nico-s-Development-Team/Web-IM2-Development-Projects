<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu Management - Nico's Delivery</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

  <!-- Header -->
  <header class="bg-white shadow px-6 py-4 flex justify-between items-center">
    <h1 class="text-xl font-bold text-blue-600">Nico's Delivery Admin</h1>
    <div>
      <button onclick="alert('Login clicked')" class="text-sm text-blue-600 hover:underline mr-4">Login</button>
      <button onclick="alert('Sign Up clicked')" class="text-sm text-blue-600 hover:underline">Sign Up</button>
    </div>
  </header>

  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-64 bg-white shadow-md px-6 py-8 hidden md:block">
      <h2 class="text-2xl font-bold text-blue-600 mb-8">Admin Panel</h2>
      <nav class="space-y-4">
        <a href="dashboard.html" class="block text-gray-700 font-medium hover:text-blue-600">Dashboard</a>
        <a href="menu.html" class="block text-blue-600 font-semibold">Menu Management</a>
        <a href="orders.html" class="block text-gray-700 font-medium hover:text-blue-600">Order Management</a>
        <a href="inventory.html" class="block text-gray-700 font-medium hover:text-blue-600">Inventory Management</a>
        <a href="customers.html" class="block text-gray-700 font-medium hover:text-blue-600">Customer Management</a>
        <a href="history.html" class="block text-gray-700 font-medium hover:text-blue-600">Order History</a>
        <a href="staff.html" class="block text-gray-700 font-medium hover:text-blue-600">Staff Management</a>
      </nav>
    </aside>

    <!-- Menu Management Content -->
    <main class="flex-1 p-10 space-y-8">
      <div class="flex justify-between items-center">
        <h2 class="text-2xl font-bold text-gray-800">Menu Management</h2>
        <button onclick="document.getElementById('addModal').classList.remove('hidden')" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
          + Add New Item
        </button>
      </div>

      <!-- Menu Table -->
      <div class="bg-white p-6 rounded-lg shadow">
        <table class="min-w-full table-auto">
          <thead>
            <tr class="bg-gray-200 text-gray-600 uppercase text-sm leading-normal">
              <th class="py-3 px-6 text-left">Name</th>
              <th class="py-3 px-6 text-left">Category</th>
              <th class="py-3 px-6 text-left">Price</th>
              <th class="py-3 px-6 text-left">Availability</th>
              <th class="py-3 px-6 text-center">Actions</th>
            </tr>
          </thead>
          <tbody class="text-gray-700 text-sm font-light">
            <tr class="border-b border-gray-200 hover:bg-gray-100">
              <td class="py-3 px-6 text-left">Classic Burger</td>
              <td class="py-3 px-6 text-left">Main</td>
              <td class="py-3 px-6 text-left">₱120</td>
              <td class="py-3 px-6 text-left">
                <span class="bg-green-200 text-green-800 px-2 py-1 rounded-full text-xs">Available</span>
              </td>
              <td class="py-3 px-6 text-center">
                <button class="text-blue-500 hover:underline mr-2" onclick="alert('Edit Item')">Edit</button>
                <button class="text-red-500 hover:underline" onclick="alert('Delete Item')">Delete</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Add New Item Modal -->
  <div id="addModal" class="hidden fixed inset-0 bg-black bg-opacity-30 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-lg w-full max-w-md p-6 space-y-4">
      <h3 class="text-xl font-semibold text-gray-800">Add New Menu Item</h3>
      <form onsubmit="event.preventDefault(); alert('Item added (demo)'); document.getElementById('addModal').classList.add('hidden');">
        <div>
          <label class="block text-gray-600">Item Name</label>
          <input type="text" required class="w-full mt-1 px-3 py-2 border border-gray-300 rounded" placeholder="e.g. Cheesy Nachos" />
        </div>
        <div>
          <label class="block text-gray-600">Category</label>
          <select required class="w-full mt-1 px-3 py-2 border border-gray-300 rounded">
            <option>Main</option>
            <option>Appetizer</option>
            <option>Beverage</option>
            <option>Dessert</option>
          </select>
        </div>
        <div>
          <label class="block text-gray-600">Price (₱)</label>
          <input type="number" required class="w-full mt-1 px-3 py-2 border border-gray-300 rounded" placeholder="e.g. 150" />
        </div>
        <div class="flex justify-end space-x-2 mt-4">
          <button type="button" onclick="document.getElementById('addModal').classList.add('hidden')" class="px-4 py-2 text-gray-700 bg-gray-200 rounded hover:bg-gray-300">Cancel</button>
          <button type="submit" class="px-4 py-2 text-white bg-blue-600 rounded hover:bg-blue-700">Add</button>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
