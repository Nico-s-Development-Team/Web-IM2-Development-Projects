<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Menu Management - Nico's Delivery</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
  <div class="flex min-h-screen">
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Sidebar -->
    <aside class="w-64 bg-white shadow-lg px-6 py-8 hidden md:flex flex-col h-screen rounded-r-2xl">
      <h2 class="text-3xl font-bold text-blue-600 mb-10 tracking-tight">Admin Panel</h2>
      <nav class="space-y-3 text-sm font-medium">
        <a href="dashboard.html" class="flex items-center gap-3 px-4 py-2 rounded-lg text-gray-700 hover:bg-gray-100 hover:text-blue-700 transition-all">
          <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
          Dashboard
        </a>
        <a href="menu.html" class="flex items-center gap-3 px-4 py-2 rounded-lg text-blue-700 bg-blue-100">
          <i data-lucide="utensils" class="w-5 h-5"></i>
          Menu Management
        </a>
        <a href="orders.html" class="flex items-center gap-3 px-4 py-2 rounded-lg text-gray-700 hover:bg-gray-100 hover:text-blue-700 transition-all">
          <i data-lucide="clipboard-list" class="w-5 h-5"></i>
          Order Management
        </a>
        <a href="user_management.html" class="flex items-center gap-3 px-4 py-2 rounded-lg text-gray-700 hover:bg-gray-100 hover:text-blue-700 transition-all">
          <i data-lucide="users" class="w-5 h-5"></i>
          User Management
        </a>
        <a href="history.html" class="flex items-center gap-3 px-4 py-2 rounded-lg text-gray-700 hover:bg-gray-100 hover:text-blue-700 transition-all">
          <i data-lucide="history" class="w-5 h-5"></i>
          Order History
        </a>
        <a href="delivery.html" class="flex items-center gap-3 px-4 py-2 rounded-lg text-gray-700 hover:bg-gray-100 hover:text-blue-700 transition-all">
          <i data-lucide="truck" class="w-5 h-5"></i>
          Delivery Management
        </a>
      </nav>
    </aside>

    <!-- Menu Content -->
    <main class="flex-1 p-10">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
        <h1 class="text-3xl font-bold text-gray-800">Menu Management</h1>
        <div class="flex gap-2">
          <button onclick="openAddModal()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Add Item</button>
        </div>
      </div>

      <div class="flex flex-wrap gap-2 mb-4">
        <input type="text" id="searchInput" placeholder="Search by customer or ID..." class="border px-3 py-2 rounded w-full sm:w-64">
        <select id="stockFilter" class="border px-3 py-2 rounded">
          <option value="">All Stock</option>
          <option value="in">In Stock</option>
          <option value="out">Out of Stock</option>
        </select>
        <select id="sortSelect" class="border px-3 py-2 rounded">
          <option value="">Sort By</option>
          <option value="name-asc">Name ↑</option>
          <option value="name-desc">Name ↓</option>
          <option value="price-asc">Price ↑</option>
          <option value="price-desc">Price ↓</option>
          <option value="stock-asc">Stock ↑</option>
          <option value="stock-desc">Stock ↓</option>
        </select>
      </div>

      <div class="bg-white rounded shadow overflow-x-auto">
        <table class="min-w-full text-sm">
          <thead class="bg-gray-100 text-left">
            <tr>
              <th class="px-4 py-2">Name</th>
              <th class="px-4 py-2">Price</th>
              <th class="px-4 py-2">Stock</th>
              <th class="px-4 py-2 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="menuTable" class="divide-y"></tbody>
        </table>

        <div id="pagination" class="flex justify-center items-center mt-4 space-x-2 text-sm py-4">
          <button id="firstPage" class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300">First</button>
          <button id="prevPage" class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300">Previous</button>
          <span id="pageInfo" class="font-semibold"></span>
          <button id="nextPage" class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300">Next</button>
          <button id="lastPage" class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300">Last</button>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div id="menuModal" class="fixed inset-0 bg-black bg-opacity-50 hidden justify-center items-center">
    <div class="bg-white p-6 rounded shadow-md w-96">
      <h2 id="modalTitle" class="text-xl font-bold mb-4">Add Menu Item</h2>
      <form id="menuForm" class="space-y-3">
        <input type="text" id="itemName" placeholder="Item Name" class="w-full border px-3 py-2 rounded" required>
        <input type="number" id="itemPrice" placeholder="Price" class="w-full border px-3 py-2 rounded" required>
        <input type="number" id="itemStock" placeholder="Stock" class="w-full border px-3 py-2 rounded" required>
        <div class="flex justify-end space-x-2">
          <button type="button" onclick="closeModal()" class="bg-gray-500 text-white px-4 py-1 rounded">Cancel</button>
          <button type="submit" class="bg-green-600 text-white px-4 py-1 rounded">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    lucide.createIcons();

    let menuItems = [];
    let editingIndex = null;
    let currentPage = 1;
    const itemsPerPage = 10;

    const menuTable = document.getElementById("menuTable");
    const menuModal = document.getElementById("menuModal");
    const modalTitle = document.getElementById("modalTitle");
    const menuForm = document.getElementById("menuForm");
    const searchInput = document.getElementById("searchInput");
    const sortSelect = document.getElementById("sortSelect");
    const stockFilter = document.getElementById("stockFilter");

    const firstPage = document.getElementById("firstPage");
    const prevPage = document.getElementById("prevPage");
    const nextPage = document.getElementById("nextPage");
    const lastPage = document.getElementById("lastPage");
    const pageInfo = document.getElementById("pageInfo");

    function loadMenu() {
      fetch("menu_api.php?action=fetch")
        .then(res => res.json())
        .then(data => {
          menuItems = data;
          renderMenu(searchInput.value);
        })
        .catch(err => console.error("Failed to load menu items:", err));
    }

    function renderMenu(searchText = "") {
      const search = searchText.toLowerCase();
      const filterStock = stockFilter.value;
      const sortValue = sortSelect.value;

      let filteredItems = menuItems.filter(item =>
        item.name.toLowerCase().includes(search)
      );

      if (filterStock === "in") filteredItems = filteredItems.filter(i => i.stock > 0);
      if (filterStock === "out") filteredItems = filteredItems.filter(i => i.stock === 0);

      filteredItems.sort((a, b) => {
        switch (sortValue) {
          case "name-asc": return a.name.localeCompare(b.name);
          case "name-desc": return b.name.localeCompare(a.name);
          case "price-asc": return a.price - b.price;
          case "price-desc": return b.price - a.price;
          case "stock-asc": return a.stock - b.stock;
          case "stock-desc": return b.stock - a.stock;
          default: return 0;
        }
      });

      const totalPages = Math.ceil(filteredItems.length / itemsPerPage);
      currentPage = Math.max(1, Math.min(currentPage, totalPages));
      const start = (currentPage - 1) * itemsPerPage;
      const paginatedItems = filteredItems.slice(start, start + itemsPerPage);

      menuTable.innerHTML = "";
      paginatedItems.forEach(item => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td class="px-4 py-2">${item.name}</td>
          <td class="px-4 py-2">₱${item.price}</td>
          <td class="px-4 py-2">${item.stock}</td>
          <td class="px-4 py-2 text-right space-x-2">
            <button onclick="editItem(${menuItems.indexOf(item)})" class="bg-yellow-500 text-white px-3 py-1 rounded text-sm">Edit</button>
            <button onclick="deleteItem(${item.id})" class="bg-red-500 text-white px-3 py-1 rounded text-sm">Delete</button>
          </td>`;
        menuTable.appendChild(row);
      });

      pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;
      prevPage.disabled = currentPage === 1;
      nextPage.disabled = currentPage === totalPages || totalPages === 0;
    }

    firstPage.addEventListener("click", () => { currentPage = 1; renderMenu(searchInput.value); });
    prevPage.addEventListener("click", () => { if (currentPage > 1) currentPage--; renderMenu(searchInput.value); });
    nextPage.addEventListener("click", () => { currentPage++; renderMenu(searchInput.value); });
    lastPage.addEventListener("click", () => {
      const filteredItems = menuItems.filter(item =>
        item.name.toLowerCase().includes(searchInput.value.toLowerCase())
      );
      const totalPages = Math.ceil(filteredItems.length / itemsPerPage);
      currentPage = totalPages;
      renderMenu(searchInput.value);
    });

    function openAddModal() {
      editingIndex = null;
      modalTitle.textContent = "Add Menu Item";
      menuForm.reset();
      menuModal.classList.remove("hidden");
      menuModal.classList.add("flex");
    }

    function editItem(index) {
      editingIndex = index;
      const item = menuItems[index];
      document.getElementById("itemName").value = item.name;
      document.getElementById("itemPrice").value = item.price;
      document.getElementById("itemStock").value = item.stock;
      modalTitle.textContent = "Edit Menu Item";
      menuModal.classList.remove("hidden");
      menuModal.classList.add("flex");
    }

    function closeModal() {
      menuModal.classList.add("hidden");
      menuModal.classList.remove("flex");
    }

    function deleteItem(id) {
      if (confirm("Delete this menu item?")) {
        const formData = new FormData();
        formData.append("action", "delete");
        formData.append("id", id);

        fetch("menu_api.php", {
          method: "POST",
          body: formData
        }).then(() => loadMenu());
      }
    }

    menuForm.addEventListener("submit", function (e) {
      e.preventDefault();

      const formData = new FormData();
      formData.append("name", document.getElementById("itemName").value);
      formData.append("price", document.getElementById("itemPrice").value);
      formData.append("stock", document.getElementById("itemStock").value);

      if (editingIndex === null) {
        formData.append("action", "add");
      } else {
        formData.append("action", "edit");
        formData.append("id", menuItems[editingIndex].id);
      }

      fetch("menu_api.php", {
        method: "POST",
        body: formData
      }).then(() => {
        closeModal();
        loadMenu();
      });
    });

    searchInput.addEventListener("input", () => renderMenu(searchInput.value));
    sortSelect.addEventListener("change", () => renderMenu(searchInput.value));
    stockFilter.addEventListener("change", () => renderMenu(searchInput.value));

    loadMenu();
  </script>
</body>
</html>
