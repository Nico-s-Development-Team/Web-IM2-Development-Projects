<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Management - Nico's Delivery</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

  <!-- Header -->
  <header class="bg-white shadow px-6 py-4 flex justify-between items-center">
    <h1 class="text-xl font-bold text-blue-600">Nico's Delivery Admin</h1>
    <div>
      <button onclick="alert('Login clicked')" class="text-sm text-blue-600 hover:underline mr-4">Login</button>
      <button onclick="alert('Sign Up clicked')" class="text-sm text-blue-600 hover:underline">Sign Up</button>
    </div>
  </header>

  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-64 bg-white shadow-md px-6 py-8 hidden md:block">
      <h2 class="text-2xl font-bold text-blue-600 mb-8">Admin Panel</h2>
      <nav class="space-y-4">
        <a href="dashboard.html" class="block text-gray-700 font-medium hover:text-blue-600">Dashboard</a>
        <a href="menu.html" class="block text-gray-700 font-medium hover:text-blue-600">Menu Management</a>
        <a href="orders.html" class="block text-gray-700 font-medium hover:text-blue-600">Order Management</a>
        <a href="inventory.html" class="block text-gray-700 font-medium hover:text-blue-600">Inventory Management</a>
        <a href="customers.html" class="block text-gray-700 font-medium hover:text-blue-600">Customer Management</a>
        <a href="history.html" class="block text-gray-700 font-medium hover:text-blue-600">Order History</a>
        <a href="staff.html" class="block text-blue-600 font-semibold">Staff Management</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-10 space-y-8">
      <div class="flex justify-between items-center">
        <h2 class="text-2xl font-bold text-gray-800">Staff Management</h2>
        <button onclick="addStaffPrompt()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Add Staff</button>
      </div>

      <!-- Staff Table -->
      <div class="bg-white p-6 rounded-lg shadow overflow-x-auto">
        <table class="min-w-full table-auto">
          <thead>
            <tr class="bg-gray-200 text-gray-600 uppercase text-sm leading-normal">
              <th class="py-3 px-6 text-left">Staff ID</th>
              <th class="py-3 px-6 text-left">Name</th>
              <th class="py-3 px-6 text-left">Position</th>
              <th class="py-3 px-6 text-left">Email</th>
              <th class="py-3 px-6 text-center">Actions</th>
            </tr>
          </thead>
          <tbody id="staffTableBody" class="text-gray-700 text-sm font-light">
            <!-- Staff data goes here -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script>
    const staffList = [
      { id: "S001", name: "Carlos Reyes", position: "Manager", email: "carlos@example.com" },
      { id: "S002", name: "Ella Santos", position: "Cashier", email: "ella@example.com" },
      { id: "S003", name: "Mark Dela Cruz", position: "Cook", email: "mark@example.com" }
    ];

    function refreshStaff() {
      const tbody = document.getElementById("staffTableBody");
      tbody.innerHTML = "";
      staffList.forEach((staff, index) => {
        tbody.innerHTML += `
          <tr class="border-b border-gray-200 hover:bg-gray-100">
            <td class="py-3 px-6 text-left">${staff.id}</td>
            <td class="py-3 px-6 text-left">${staff.name}</td>
            <td class="py-3 px-6 text-left">${staff.position}</td>
            <td class="py-3 px-6 text-left">${staff.email}</td>
            <td class="py-3 px-6 text-center">
              <button class="text-blue-500 hover:underline mr-2" onclick="editStaff(${index})">Edit</button>
              <button class="text-red-500 hover:underline" onclick="deleteStaff(${index})">Delete</button>
            </td>
          </tr>
        `;
      });
    }

    function addStaffPrompt() {
      const name = prompt("Enter staff name:");
      const position = prompt("Enter position:");
      const email = prompt("Enter email:");
      if (name && position && email) {
        const newId = `S00${staffList.length + 1}`;
        staffList.push({ id: newId, name, position, email });
        refreshStaff();
        alert("Staff member added.");
      }
    }

    function editStaff(index) {
      const staff = staffList[index];
      const name = prompt("Edit name:", staff.name);
      const position = prompt("Edit position:", staff.position);
      const email = prompt("Edit email:", staff.email);
      if (name && position && email) {
        staffList[index] = { ...staff, name, position, email };
        refreshStaff();
        alert("Staff updated.");
      }
    }

    function deleteStaff(index) {
      if (confirm("Are you sure you want to delete this staff member?")) {
        staffList.splice(index, 1);
        refreshStaff();
        alert("Staff member deleted.");
      }
    }

    // Initial load
    refreshStaff();
  </script>

</body>
</html>
