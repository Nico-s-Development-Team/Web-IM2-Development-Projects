<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Management - Nico's Delivery</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-64 bg-white shadow-md px-6 py-8 hidden md:block">
      <h2 class="text-2xl font-bold text-blue-600 mb-8">Admin Panel</h2>
      <nav class="space-y-4">
        <a href="dashboard.html" class="block text-black font-medium hover:text-blue-700">Dashboard</a>
        <a href="menu.html" class="block text-black font-medium hover:text-blue-700">Menu Management</a>
        <a href="orders.html" class="block text-black font-medium hover:text-blue-700">Order Management</a>
        <a href="inventory.html" class="block text-black font-medium hover:text-blue-700">Inventory Management</a>
        <a href="customers.html" class="block text-black font-medium hover:text-blue-700">Customer Management</a>
        <a href="history.html" class="block text-black font-medium hover:text-blue-700">Order History</a>
        <a href="staff.html" class="block text-blue-700 font-semibold">Staff Management</a>
        <a href="delivery.html" class="block text-black font-medium hover:text-blue-700">Delivery Management</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-6">
      <div class="flex flex-col sm:flex-row justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-gray-800">Staff Management</h1>
        <div class="space-x-2 mt-4 sm:mt-0">
          <button onclick="openProfile()" class="bg-blue-600 text-white px-4 py-2 rounded">Profile</button>
          <button onclick="openAddModal()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Add Staff</button>
        </div>
      </div>

      <!-- Search Bar -->
      <div class="flex flex-wrap gap-2 mb-4">
        <input type="text" id="searchInput" placeholder="Search staff..." class="border px-4 py-2 rounded w-full sm:w-64" />
        <select id="positionFilter" class="border px-4 py-2 rounded">
          <option value="">All Positions</option>
          <option value="Manager">Manager</option>
          <option value="Cashier">Cashier</option>
          <option value="Cook">Cook</option>
        </select>
        <select id="sortSelect" class="border px-4 py-2 rounded">
          <option value="nameAsc">Sort: Name (A-Z)</option>
          <option value="nameDesc">Sort: Name (Z-A)</option>
          <option value="positionAsc">Sort: Position (A-Z)</option>
          <option value="positionDesc">Sort: Position (Z-A)</option>
        </select>
      </div>


      <!-- Staff Table -->
      <div class="bg-white rounded shadow overflow-x-auto">
        <table class="min-w-full text-sm">
          <thead class="bg-gray-100 text-left">
            <tr>
              <th class="px-4 py-2">ID</th>
              <th class="px-4 py-2">Name</th>
              <th class="px-4 py-2">Position</th>
              <th class="px-4 py-2">Email</th>
              <th class="px-4 py-2 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="staffTableBody" class="divide-y"></tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Profile Modal -->
  <div id="profileModal" class="fixed inset-0 bg-black bg-opacity-50 hidden justify-center items-center z-50">
    <div class="bg-white p-6 rounded shadow-md w-96">
      <h2 class="text-xl font-bold mb-4">My Profile</h2>
      <form id="profileForm" class="space-y-3">
        <input type="text" id="profileName" placeholder="Full Name" class="w-full border px-3 py-2 rounded" required>
        <input type="email" id="profileEmail" placeholder="Email" class="w-full border px-3 py-2 rounded" required>
        <input type="password" id="profilePassword" placeholder="Password" class="w-full border px-3 py-2 rounded" required>
        <div class="flex justify-end space-x-2">
          <button type="button" onclick="closeProfile()" class="bg-gray-500 text-white px-4 py-1 rounded">Cancel</button>
          <button type="submit" class="bg-green-600 text-white px-4 py-1 rounded">Save</button>
        </div>
      </form>
    </div>
  </div>


   <!-- Staff Modal -->
  <div id="staffModal" class="fixed inset-0 bg-black bg-opacity-50 hidden justify-center items-center z-50">
    <div class="bg-white p-6 rounded shadow-md w-96">
      <h2 id="staffModalTitle" class="text-xl font-bold mb-4">Add Staff</h2>
      <form id="staffForm" class="space-y-3">
        <input type="text" id="staffName" placeholder="Full Name" class="w-full border px-3 py-2 rounded" required>
        <input type="text" id="staffPosition" placeholder="Position" class="w-full border px-3 py-2 rounded" required>
        <input type="email" id="staffEmail" placeholder="Email" class="w-full border px-3 py-2 rounded" required>
        <div class="flex justify-end space-x-2">
          <button type="button" onclick="closeStaffModal()" class="bg-gray-500 text-white px-4 py-1 rounded">Cancel</button>
          <button type="submit" class="bg-green-600 text-white px-4 py-1 rounded">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const staffList = [
      { id: "S001", name: "Carlos Reyes", position: "Manager", email: "carlos@example.com" },
      { id: "S002", name: "Ella Santos", position: "Cashier", email: "ella@example.com" },
      { id: "S003", name: "Mark Dela Cruz", position: "Cook", email: "mark@example.com" }
    ];

    let editingStaffIndex = null;

    function renderStaff(filter = "") {
      const sortOption = document.getElementById("sortSelect").value;
      const positionFilter = document.getElementById("positionFilter").value;
      const tbody = document.getElementById("staffTableBody");
      tbody.innerHTML = "";

      let filtered = staffList.filter(s =>
        (s.name.toLowerCase().includes(filter.toLowerCase()) ||
        s.email.toLowerCase().includes(filter.toLowerCase()) ||
        s.position.toLowerCase().includes(filter.toLowerCase())) &&
        (!positionFilter || s.position === positionFilter)
      );

      // Sort logic
      filtered.sort((a, b) => {
        if (sortOption === "nameAsc") return a.name.localeCompare(b.name);
        if (sortOption === "nameDesc") return b.name.localeCompare(a.name);
        if (sortOption === "positionAsc") return a.position.localeCompare(b.position);
        if (sortOption === "positionDesc") return b.position.localeCompare(a.position);
        return 0;
      });

      // Render filtered & sorted rows
      filtered.forEach((staff, index) => {
        tbody.innerHTML += `
          <tr class="border-b border-gray-200 hover:bg-gray-100">
            <td class="py-3 px-6">${staff.id}</td>
            <td class="py-3 px-6">${staff.name}</td>
            <td class="py-3 px-6">${staff.position}</td>
            <td class="py-3 px-6">${staff.email}</td>
            <td class="py-3 px-6 text-right">
              <button onclick="editStaff(${index})" class="bg-yellow-500 text-white px-3 py-1 rounded text-sm">Edit</button>
              <button onclick="deleteStaff(${index})" class="bg-red-500 text-white px-3 py-1 rounded text-sm">Delete</button>
            </td>
          </tr>
        `;
      });
    }

    // Sample user data (replace with dynamic values if needed)
  let loggedInUser = {
    name: "Alex Reyes",
    email: "alex@example.com",
    password: "password123"
  };

  function openProfile() {
    document.getElementById("profileName").value = loggedInUser.name;
    document.getElementById("profileEmail").value = loggedInUser.email;
    document.getElementById("profilePassword").value = loggedInUser.password;
    document.getElementById("profileModal").classList.remove("hidden");
    document.getElementById("profileModal").classList.add("flex");
  }

    function closeProfile() {
      document.getElementById("profileModal").classList.add("hidden");
      document.getElementById("profileModal").classList.remove("flex");
    }

    document.getElementById("profileForm").addEventListener("submit", function (e) {
      e.preventDefault();
      loggedInUser.name = document.getElementById("profileName").value;
      loggedInUser.email = document.getElementById("profileEmail").value;
      loggedInUser.password = document.getElementById("profilePassword").value;
      alert("Profile updated successfully!");
      closeProfile();
    });

    function openAddModal() {
      editingStaffIndex = null;
      document.getElementById("staffModalTitle").textContent = "Add Staff";
      document.getElementById("staffForm").reset();
      document.getElementById("staffModal").classList.remove("hidden");
      document.getElementById("staffModal").classList.add("flex");
    }

    function editStaff(index) {
      editingStaffIndex = index;
      const s = staffList[index];
      document.getElementById("staffModalTitle").textContent = "Edit Staff";
      document.getElementById("staffName").value = s.name;
      document.getElementById("staffPosition").value = s.position;
      document.getElementById("staffEmail").value = s.email;
      document.getElementById("staffModal").classList.remove("hidden");
      document.getElementById("staffModal").classList.add("flex");
    }

    function deleteStaff(index) {
      if (confirm("Are you sure you want to delete this staff member?")) {
        staffList.splice(index, 1);
        renderStaff();
      }
    }

    function closeStaffModal() {
      document.getElementById("staffModal").classList.add("hidden");
      document.getElementById("staffModal").classList.remove("flex");
    }

    document.getElementById("staffForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const name = document.getElementById("staffName").value;
      const position = document.getElementById("staffPosition").value;
      const email = document.getElementById("staffEmail").value;

      if (editingStaffIndex === null) {
        const newId = `S00${staffList.length + 1}`;
        staffList.push({ id: newId, name, position, email });
      } else {
        staffList[editingStaffIndex] = { ...staffList[editingStaffIndex], name, position, email };
      }

      closeStaffModal();
      renderStaff();
    });

    document.getElementById("searchInput").addEventListener("input", (e) => {
      renderStaff(e.target.value);
    });

    document.getElementById("positionFilter").addEventListener("change", () => {
      renderStaff(document.getElementById("searchInput").value);
    });
    
    renderStaff();
  </script>

</body>
</html>
