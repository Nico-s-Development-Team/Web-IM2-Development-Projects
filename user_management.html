<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management - Nico's Delivery</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <aside class="w-64 bg-white shadow-lg px-6 py-8 hidden md:flex flex-col h-screen rounded-r-2xl">
      <h2 class="text-3xl font-bold text-blue-600 mb-10 tracking-tight">Admin Panel</h2>
      <nav class="space-y-3 text-sm font-medium">
        <a href="dashboard.html" class="flex items-center gap-3 px-4 py-2 rounded-lg text-gray-700 hover:bg-gray-100 hover:text-blue-700 transition-all">
          <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
          Dashboard
        </a>
        <a href="menu.html" class="flex items-center gap-3 px-4 py-2 rounded-lg text-gray-700 hover:bg-gray-100 hover:text-blue-700 transition-all">
          <i data-lucide="utensils" class="w-5 h-5"></i>
          Menu Management
        </a>
        <a href="orders.html" class="flex items-center gap-3 px-4 py-2 rounded-lg text-gray-700 hover:bg-gray-100 hover:text-blue-700 transition-all">
          <i data-lucide="clipboard-list" class="w-5 h-5"></i>
          Order Management
        </a>
        <a href="user_management.html" class="flex items-center gap-3 px-4 py-2 rounded-lg text-blue-700 bg-blue-100">
          <i data-lucide="users" class="w-5 h-5"></i>
          User Management
        </a>
        <a href="history.html" class="flex items-center gap-3 px-4 py-2 rounded-lg text-gray-700 hover:bg-gray-100 hover:text-blue-700 transition-all">
          <i data-lucide="history" class="w-5 h-5"></i>
          Order History
        </a>
        <a href="delivery.html" class="flex items-center gap-3 px-4 py-2 rounded-lg text-gray-700 hover:bg-gray-100 hover:text-blue-700 transition-all">
          <i data-lucide="truck" class="w-5 h-5"></i>
          Delivery Management
        </a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-6">
      <div class="flex flex-col sm:flex-row justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-gray-800">User Management</h1>
        <button onclick="openUserModal()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Add User</button>
      </div>

      <!-- Filters -->
      <div class="flex flex-wrap gap-2 mb-4">
        <input type="text" id="searchInput" placeholder="Search user..." class="border px-4 py-2 rounded w-full sm:w-64" />
        <select id="roleFilter" class="border px-4 py-2 rounded">
          <option value="">All Roles</option>
          <option value="Customer">Customer</option>
          <option value="Manager">Manager</option>
          <option value="Cashier">Cashier</option>
          <option value="Cook">Cook</option>
        </select>
      </div>

      <!-- User Table -->
      <div class="bg-white rounded shadow overflow-x-auto">
        <table class="min-w-full text-sm">
          <thead class="bg-gray-100 text-left">
            <tr>
              <th class="px-4 py-2">Name</th>
              <th class="px-4 py-2">Email</th>
              <th class="px-4 py-2">Role</th>
              <th class="px-4 py-2">Phone</th>
              <th class="px-4 py-2">Address</th>
              <th class="px-4 py-2 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="userTable" class="divide-y"></tbody>
        </table>
        <div id="pagination" class="flex justify-center items-center mt-4 space-x-2 text-sm py-4">
            <button id="firstPage" class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300">First</button>
            <button id="prevPage" class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300">Previous</button>
            <span id="pageInfo" class="font-semibold"></span>
            <button id="nextPage" class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300">Next</button>
            <button id="lastPage" class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300">Last</button>
          </div>
      </div>
    </main>
  </div>

  <!-- User Modal -->
  <div id="userModal" class="fixed inset-0 bg-black bg-opacity-50 hidden justify-center items-center z-50">
    <div class="bg-white p-6 rounded shadow-md w-96">
      <h2 id="modalTitle" class="text-xl font-bold mb-4">Add User</h2>
      <form id="userForm" class="space-y-3">
        <input type="text" id="userName" placeholder="Full Name" class="w-full border px-3 py-2 rounded" required>
        <input type="email" id="userEmail" placeholder="Email" class="w-full border px-3 py-2 rounded" required>
        <select id="userRole" class="w-full border px-3 py-2 rounded" required>
          <option value="Customer">Customer</option>
          <option value="Manager">Manager</option>
          <option value="Cashier">Cashier</option>
          <option value="Cook">Cook</option>
        </select>
        <input type="text" id="userPhone" placeholder="Phone Number" class="w-full border px-3 py-2 rounded">
        <input type="text" id="userAddress" placeholder="Address" class="w-full border px-3 py-2 rounded">
        <div class="flex justify-end space-x-2">
          <button type="button" onclick="closeUserModal()" class="bg-gray-500 text-white px-4 py-1 rounded">Cancel</button>
          <button type="submit" class="bg-green-600 text-white px-4 py-1 rounded">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    lucide.createIcons();

    let users = [];

    async function loadUsers() {
      try {
        const response = await fetch('fetch_users.php');
        const data = await response.json();
        users = data;
        renderUsers();
      } catch (error) {
        console.error('Failed to load users:', error);
      }
    }


    let editingIndex = null;

    let currentPage = 1;
    const rowsPerPage = 10; // limit of content displayed

    const pagination = document.getElementById("pagination");
    const firstPage = document.getElementById("firstPage");
    const prevPage = document.getElementById("prevPage");
    const nextPage = document.getElementById("nextPage");
    const lastPage = document.getElementById("lastPage");
    const pageInfo = document.getElementById("pageInfo");

    function renderUsers(filter = "") {
      const roleFilter = document.getElementById("roleFilter").value;
      const table = document.getElementById("userTable");
      table.innerHTML = "";

      const filtered = users.filter(u =>
        (u.name.toLowerCase().includes(filter.toLowerCase()) || u.email.toLowerCase().includes(filter.toLowerCase())) &&
        (!roleFilter || u.role === roleFilter)
      );

      const start = (currentPage - 1) * rowsPerPage;
      const paginated = filtered.slice(start, start + rowsPerPage);

      paginated.forEach((user, index) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td class="px-4 py-2">${user.name}</td>
          <td class="px-4 py-2">${user.email}</td>
          <td class="px-4 py-2">${user.role}</td>
          <td class="px-4 py-2">${user.phone || '—'}</td>
          <td class="px-4 py-2">${user.address || '—'}</td>
          <td class="px-4 py-2 text-right space-x-2">
            <button onclick="editUser(${users.indexOf(user)})" class="bg-yellow-500 text-white px-3 py-1 rounded text-sm">Edit</button>
            <button onclick="deleteUser(${users.indexOf(user)})" class="bg-red-500 text-white px-3 py-1 rounded text-sm">Delete</button>
          </td>
        `;
        table.appendChild(row);
      });

      const pageInfo = document.getElementById("pageInfo");
      const totalPages = Math.ceil(filtered.length / rowsPerPage);
      pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;
    }

    function changePage(offset) {
      const roleFilter = document.getElementById("roleFilter").value;
      const filter = document.getElementById("searchInput").value;
      const filtered = users.filter(u =>
        (u.name.toLowerCase().includes(filter.toLowerCase()) || u.email.toLowerCase().includes(filter.toLowerCase())) &&
        (!roleFilter || u.role === roleFilter)
      );
      const totalPages = Math.ceil(filtered.length / rowsPerPage);
      currentPage = Math.max(1, Math.min(currentPage + offset, totalPages));
      renderUsers(filter);
    }

    function openUserModal() {
      editingIndex = null;
      document.getElementById("modalTitle").textContent = "Add User";
      document.getElementById("userForm").reset();
      document.getElementById("userModal").classList.remove("hidden");
      document.getElementById("userModal").classList.add("flex");
    }

    function closeUserModal() {
      document.getElementById("userModal").classList.add("hidden");
      document.getElementById("userModal").classList.remove("flex");
    }

    function editUser(index) {
      editingIndex = index;
      const u = users[index];
      document.getElementById("modalTitle").textContent = "Edit User";
      document.getElementById("userName").value = u.name;
      document.getElementById("userEmail").value = u.email;
      document.getElementById("userRole").value = u.role;
      document.getElementById("userPhone").value = u.phone;
      document.getElementById("userAddress").value = u.address;
      document.getElementById("userModal").classList.remove("hidden");
      document.getElementById("userModal").classList.add("flex");
    }

    function deleteUser(index) {
      if (confirm("Delete this user?")) {
        users.splice(index, 1);
        renderUsers(document.getElementById("searchInput").value);
      }
    }

    firstPage.addEventListener("click", () => {
  currentPage = 1;
  renderUsers(document.getElementById("searchInput").value);
});

prevPage.addEventListener("click", () => {
  changePage(-1);
});

nextPage.addEventListener("click", () => {
  changePage(1);
});

lastPage.addEventListener("click", () => {
  const filter = document.getElementById("searchInput").value;
  const roleFilter = document.getElementById("roleFilter").value;

  const filtered = users.filter(u =>
    (u.name.toLowerCase().includes(filter.toLowerCase()) || u.email.toLowerCase().includes(filter.toLowerCase())) &&
    (!roleFilter || u.role === roleFilter)
  );

  currentPage = Math.ceil(filtered.length / rowsPerPage);
  renderUsers(filter);
});


    document.getElementById("userForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const newUser = {
        name: document.getElementById("userName").value,
        email: document.getElementById("userEmail").value,
        role: document.getElementById("userRole").value,
        phone: document.getElementById("userPhone").value,
        address: document.getElementById("userAddress").value,
      };

      if (editingIndex === null) {
        users.push(newUser);
      } else {
        users[editingIndex] = newUser;
      }

      closeUserModal();
      renderUsers(document.getElementById("searchInput").value);
    });

    document.getElementById("searchInput").addEventListener("input", (e) => {
      currentPage = 1;
      renderUsers(e.target.value);
    });

    document.getElementById("roleFilter").addEventListener("change", () => {
      currentPage = 1;
      renderUsers(document.getElementById("searchInput").value);
    });

    loadUsers();
  </script>

</body>
</html>
