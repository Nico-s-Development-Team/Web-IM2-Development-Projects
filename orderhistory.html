<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order History</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-red-400 to-yellow-300 font-sans text-gray-800">

  <div class="flex justify-center py-10 px-4">
    <div class="w-full max-w-4xl bg-white shadow-md rounded-xl p-6">
      <!-- Back Button -->
      <div class="mb-4">
        <a href="orderPage.php" class="inline-flex items-center text-sm text-red-500 hover:text-red-600 font-semibold transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          </svg>
          Back
        </a>
      </div>

      <!-- Title -->
      <div class="mb-6">
        <h1 class="text-2xl font-bold border-b pb-2 text-gray-700">Order History</h1>
      </div>

      <!-- Orders Container -->
      <div id="order-history-container" class="space-y-6 max-h-[500px] overflow-y-auto pr-1">
        <!-- Rendered content will be injected here -->
      </div>
    </div>
  </div>

  <!-- JS to load order history -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      fetch('fetch_order_history.php')
        .then(response => response.text())
        .then(html => {
          document.getElementById('order-history-container').innerHTML = html;
        });
    });
  </script>

</body>
</html>
