<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Management - Nico's Delivery</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

  <!-- Header -->
  <header class="bg-white shadow px-6 py-4 flex justify-between items-center">
    <h1 class="text-xl font-bold text-blue-600">Nico's Delivery Admin</h1>
    <div>
      <button onclick="alert('Login clicked')" class="text-sm text-blue-600 hover:underline mr-4">Login</button>
      <button onclick="alert('Sign Up clicked')" class="text-sm text-blue-600 hover:underline">Sign Up</button>
    </div>
  </header>

  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-64 bg-white shadow-md px-6 py-8 hidden md:block">
      <h2 class="text-2xl font-bold text-blue-600 mb-8">Admin Panel</h2>
      <nav class="space-y-4">
        <a href="dashboard.html" class="block text-gray-700 font-medium hover:text-blue-600">Dashboard</a>
        <a href="menu.html" class="block text-gray-700 font-medium hover:text-blue-600">Menu Management</a>
        <a href="orders.html" class="block text-gray-700 font-medium hover:text-blue-600">Order Management</a>
        <a href="inventory.html" class="block text-gray-700 font-medium hover:text-blue-600">Inventory Management</a>
        <a href="customers.html" class="block text-blue-600 font-semibold">Customer Management</a>
        <a href="history.html" class="block text-gray-700 font-medium hover:text-blue-600">Order History</a>
        <a href="staff.html" class="block text-gray-700 font-medium hover:text-blue-600">Staff Management</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-10 space-y-8">
      <div class="flex justify-between items-center">
        <h2 class="text-2xl font-bold text-gray-800">Customer Management</h2>
        <button onclick="addCustomerPrompt()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Add Customer</button>
      </div>

      <!-- Customer Table -->
      <div class="bg-white p-6 rounded-lg shadow overflow-x-auto">
        <table class="min-w-full table-auto">
          <thead>
            <tr class="bg-gray-200 text-gray-600 uppercase text-sm leading-normal">
              <th class="py-3 px-6 text-left">Customer ID</th>
              <th class="py-3 px-6 text-left">Name</th>
              <th class="py-3 px-6 text-left">Email</th>
              <th class="py-3 px-6 text-left">Phone</th>
              <th class="py-3 px-6 text-center">Actions</th>
            </tr>
          </thead>
          <tbody id="customerTableBody" class="text-gray-700 text-sm font-light">
            <!-- Customer data goes here -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script>
    const customers = [
      { id: "C001", name: "Ana Reyes", email: "ana@example.com", phone: "09171234567" },
      { id: "C002", name: "Liam Santos", email: "liam@example.com", phone: "09181234567" },
      { id: "C003", name: "Mia Dela Cruz", email: "mia@example.com", phone: "09192233445" }
    ];

    function refreshCustomers() {
      const tbody = document.getElementById("customerTableBody");
      tbody.innerHTML = "";
      customers.forEach((customer, index) => {
        tbody.innerHTML += `
          <tr class="border-b border-gray-200 hover:bg-gray-100">
            <td class="py-3 px-6 text-left">${customer.id}</td>
            <td class="py-3 px-6 text-left">${customer.name}</td>
            <td class="py-3 px-6 text-left">${customer.email}</td>
            <td class="py-3 px-6 text-left">${customer.phone}</td>
            <td class="py-3 px-6 text-center">
              <button class="text-blue-500 hover:underline mr-2" onclick="editCustomer(${index})">Edit</button>
              <button class="text-red-500 hover:underline" onclick="deleteCustomer(${index})">Delete</button>
            </td>
          </tr>
        `;
      });
    }

    function addCustomerPrompt() {
      const name = prompt("Enter customer name:");
      const email = prompt("Enter email:");
      const phone = prompt("Enter phone number:");
      if (name && email && phone) {
        const newId = `C00${customers.length + 1}`;
        customers.push({ id: newId, name, email, phone });
        refreshCustomers();
        alert("Customer added.");
      }
    }

    function editCustomer(index) {
      const customer = customers[index];
      const name = prompt("Edit name:", customer.name);
      const email = prompt("Edit email:", customer.email);
      const phone = prompt("Edit phone:", customer.phone);
      if (name && email && phone) {
        customers[index] = { ...customer, name, email, phone };
        refreshCustomers();
        alert("Customer updated.");
      }
    }

    function deleteCustomer(index) {
      if (confirm("Are you sure you want to delete this customer?")) {
        customers.splice(index, 1);
        refreshCustomers();
        alert("Customer deleted.");
      }
    }

    // Initial load
    refreshCustomers();
  </script>

</body>
</html>
