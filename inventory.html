<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Management - Nico's Delivery</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

  <!-- Header -->
  <header class="bg-white shadow px-6 py-4 flex justify-between items-center">
    <h1 class="text-xl font-bold text-blue-600">Nico's Delivery Admin</h1>
    <div>
      <button onclick="alert('Login clicked')" class="text-sm text-blue-600 hover:underline mr-4">Login</button>
      <button onclick="alert('Sign Up clicked')" class="text-sm text-blue-600 hover:underline">Sign Up</button>
    </div>
  </header>

  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-64 bg-white shadow-md px-6 py-8 hidden md:block">
      <h2 class="text-2xl font-bold text-blue-600 mb-8">Admin Panel</h2>
      <nav class="space-y-4">
        <a href="dashboard.html" class="block text-gray-700 font-medium hover:text-blue-600">Dashboard</a>
        <a href="menu.html" class="block text-gray-700 font-medium hover:text-blue-600">Menu Management</a>
        <a href="orders.html" class="block text-gray-700 font-medium hover:text-blue-600">Order Management</a>
        <a href="inventory.html" class="block text-blue-600 font-semibold">Inventory Management</a>
        <a href="customers.html" class="block text-gray-700 font-medium hover:text-blue-600">Customer Management</a>
        <a href="history.html" class="block text-gray-700 font-medium hover:text-blue-600">Order History</a>
        <a href="staff.html" class="block text-gray-700 font-medium hover:text-blue-600">Staff Management</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-10 space-y-8">
      <div class="flex justify-between items-center">
        <h2 class="text-2xl font-bold text-gray-800">Inventory Management</h2>
        <button onclick="restockInventory()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Restock All</button>
      </div>

      <!-- Inventory Table -->
      <div class="bg-white p-6 rounded-lg shadow overflow-x-auto">
        <table class="min-w-full table-auto">
          <thead>
            <tr class="bg-gray-200 text-gray-600 uppercase text-sm leading-normal">
              <th class="py-3 px-6 text-left">Item</th>
              <th class="py-3 px-6 text-left">Stock</th>
              <th class="py-3 px-6 text-left">Unit</th>
              <th class="py-3 px-6 text-left">Status</th>
              <th class="py-3 px-6 text-center">Actions</th>
            </tr>
          </thead>
          <tbody id="inventoryTableBody" class="text-gray-700 text-sm font-light">
            <!-- Inventory items will be inserted here -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script>
    const inventory = [
      { name: "Burger Buns", stock: 12, unit: "pcs" },
      { name: "Lumpia Wrapper", stock: 3, unit: "packs" },
      { name: "Soda Bottles", stock: 25, unit: "pcs" }
    ];

    function refreshInventory() {
      const tbody = document.getElementById("inventoryTableBody");
      tbody.innerHTML = "";

      inventory.forEach((item, index) => {
        const statusClass = item.stock < 5 ? "bg-yellow-200 text-yellow-800" : "bg-green-200 text-green-800";
        const statusLabel = item.stock < 5 ? "Low Stock" : "Sufficient";

        tbody.innerHTML += `
          <tr class="border-b border-gray-200 hover:bg-gray-100">
            <td class="py-3 px-6 text-left">${item.name}</td>
            <td class="py-3 px-6 text-left">${item.stock}</td>
            <td class="py-3 px-6 text-left">${item.unit}</td>
            <td class="py-3 px-6 text-left">
              <span class="${statusClass} px-2 py-1 rounded-full text-xs">${statusLabel}</span>
            </td>
            <td class="py-3 px-6 text-center">
              <button class="text-blue-500 hover:underline mr-2" onclick="restockItem(${index})">Restock</button>
              <button class="text-red-500 hover:underline" onclick="decreaseStock(${index})">Use</button>
            </td>
          </tr>
        `;
      });
    }

    function restockItem(index) {
      inventory[index].stock += 10;
      refreshInventory();
      alert(`${inventory[index].name} restocked.`);
    }

    function decreaseStock(index) {
      if (inventory[index].stock > 0) {
        inventory[index].stock -= 1;
        refreshInventory();
      } else {
        alert(`${inventory[index].name} is out of stock!`);
      }
    }

    function restockInventory() {
      inventory.forEach(item => item.stock += 10);
      refreshInventory();
      alert("All items have been restocked.");
    }

    // Initial load
    refreshInventory();
  </script>

</body>
</html>
