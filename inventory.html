<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Management - Nico's Delivery</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-64 bg-white shadow-md px-6 py-8">
      <h2 class="text-2xl font-bold text-blue-600 mb-8">Admin Panel</h2>
      <nav class="space-y-4">
        <a href="dashboard.html" class="block text-blue-700 font-semibold">Dashboard</a>
        <a href="menu.html" class="block text-black-700 font-medium hover:text-blue-700">Menu Management</a>
        <a href="orders.html" class="block text-black-700 font-medium hover:text-blue-700">Order Management</a>
        <a href="inventory.html" class="block text-black-700 font-medium hover:text-blue-700">Inventory Management</a>
        <a href="user_management.html" class="block text-black-700 font-medium hover:text-blue-700">User Management</a>
        <a href="history.html" class="block text-black-700 font-medium hover:text-blue-700">Order History</a>
        <a href="delivery.html" class="block text-black-700 font-medium hover:text-blue-700">Delivery Management</a>
      </nav>
    </aside>

    <!-- Inventory Content -->
    <main class="flex-1 p-10">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
        <h1 class="text-3xl font-bold text-gray-800">Inventory Management</h1>
        <button onclick="openAddModal()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Add Item</button>
      </div>

      <div class="flex flex-wrap gap-2 mb-4">
        <select id="categoryFilter" class="border px-3 py-2 rounded">
          <option value="">All Categories</option>
          <option value="Ingredient">Ingredient</option>
          <option value="Menu Item">Menu Item</option>
        </select>
        <select id="statusFilter" class="border px-3 py-2 rounded">
          <option value="">All Statuses</option>
          <option value="in">In Stock</option>
          <option value="low">Low Stock</option>
          <option value="out">Out of Stock</option>
        </select>
        <input type="text" id="searchInput" placeholder="Search item..." class="border px-3 py-2 rounded w-full sm:w-64">
      </div>

      <div class="bg-white rounded shadow overflow-x-auto">
        <table class="min-w-full text-sm">
          <thead class="bg-gray-100 text-left">
            <tr>
              <th class="px-4 py-2">Item Name</th>
              <th class="px-4 py-2">Category</th>
              <th class="px-4 py-2">Stock</th>
              <th class="px-4 py-2">Unit</th>
              <th class="px-4 py-2">Status</th>
              <th class="px-4 py-2 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="inventoryTable" class="divide-y"></tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Add/Edit Modal -->
  <div id="inventoryModal" class="fixed inset-0 bg-black bg-opacity-50 hidden justify-center items-center">
    <div class="bg-white p-6 rounded shadow-md w-96">
      <h2 id="modalTitle" class="text-xl font-bold mb-4">Add Inventory Item</h2>
      <form id="inventoryForm" class="space-y-3">
        <input type="text" id="invName" placeholder="Item Name" class="w-full border px-3 py-2 rounded" required>
        <select id="invCategory" class="w-full border px-3 py-2 rounded" required>
          <option value="">Select Category</option>
          <option value="Ingredient">Ingredient</option>
          <option value="Menu Item">Menu Item</option>
        </select>
        <input type="text" id="invUnit" placeholder="Unit (kg, pcs, L, etc.)" class="w-full border px-3 py-2 rounded" required>
        <input type="number" id="invStock" placeholder="Stock" class="w-full border px-3 py-2 rounded" required>
        <div class="flex justify-end space-x-2">
          <button type="button" onclick="closeModal()" class="bg-gray-500 text-white px-4 py-1 rounded">Cancel</button>
          <button type="submit" class="bg-green-600 text-white px-4 py-1 rounded">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let inventory = [
      { name: "Chicken Breast", category: "Ingredient", stock: 10, unit: "kg" },
      { name: "Spaghetti Sauce", category: "Ingredient", stock: 3, unit: "L" },
      { name: "Beef Burger", category: "Menu Item", stock: 0, unit: "pcs" }
    ];

    let editingIndex = null;
    const inventoryTable = document.getElementById("inventoryTable");
    const inventoryModal = document.getElementById("inventoryModal");
    const modalTitle = document.getElementById("modalTitle");
    const inventoryForm = document.getElementById("inventoryForm");
    const searchInput = document.getElementById("searchInput");
    const categoryFilter = document.getElementById("categoryFilter");
    const statusFilter = document.getElementById("statusFilter");

    function getStatus(stock) {
      if (stock === 0) return { label: "Out of Stock", color: "text-red-600" };
      if (stock <= 5) return { label: "Low Stock", color: "text-yellow-600" };
      return { label: "In Stock", color: "text-green-600" };
    }

    function renderInventory() {
      const filterText = searchInput.value.toLowerCase();
      const category = categoryFilter.value;
      const status = statusFilter.value;

      inventoryTable.innerHTML = "";
      inventory.forEach((item, index) => {
        const itemStatus = getStatus(item.stock);
        const statusKey = itemStatus.label.toLowerCase();

        if ((item.name.toLowerCase().includes(filterText)) &&
            (!category || item.category === category) &&
            (!status || statusKey.includes(status))) {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td class="px-4 py-2">${item.name}</td>
            <td class="px-4 py-2">${item.category}</td>
            <td class="px-4 py-2">${item.stock}</td>
            <td class="px-4 py-2">${item.unit}</td>
            <td class="px-4 py-2 font-bold ${itemStatus.color}">${itemStatus.label}</td>
            <td class="px-4 py-2 text-right space-x-2">
              <button onclick="editItem(${index})" class="bg-yellow-500 text-white px-3 py-1 rounded text-sm">Edit</button>
              <button onclick="deleteItem(${index})" class="bg-red-500 text-white px-3 py-1 rounded text-sm">Delete</button>
            </td>
          `;
          inventoryTable.appendChild(row);
        }
      });
    }

    function openAddModal() {
      editingIndex = null;
      modalTitle.textContent = "Add Inventory Item";
      inventoryForm.reset();
      inventoryModal.classList.remove("hidden");
      inventoryModal.classList.add("flex");
    }

    function editItem(index) {
      editingIndex = index;
      modalTitle.textContent = "Edit Inventory Item";
      const item = inventory[index];
      document.getElementById("invName").value = item.name;
      document.getElementById("invCategory").value = item.category;
      document.getElementById("invUnit").value = item.unit;
      document.getElementById("invStock").value = item.stock;
      inventoryModal.classList.remove("hidden");
      inventoryModal.classList.add("flex");
    }

    function deleteItem(index) {
      if (confirm("Delete this item from inventory?")) {
        inventory.splice(index, 1);
        renderInventory();
      }
    }

    function closeModal() {
      inventoryModal.classList.add("hidden");
      inventoryModal.classList.remove("flex");
    }

    inventoryForm.addEventListener("submit", function(e) {
      e.preventDefault();
      const newItem = {
        name: document.getElementById("invName").value,
        category: document.getElementById("invCategory").value,
        unit: document.getElementById("invUnit").value,
        stock: parseFloat(document.getElementById("invStock").value)
      };
      if (editingIndex === null) {
        inventory.push(newItem);
      } else {
        inventory[editingIndex] = newItem;
      }
      closeModal();
      renderInventory();
    });

    [searchInput, categoryFilter, statusFilter].forEach(el => el.addEventListener("input", renderInventory));

    renderInventory();
  </script>
</body>
</html>
